<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body class="bg-zinc-950 text-white h-screen overflow-hidden">

    <div class="flex h-screen">

        <!-- MOBILE OVERLAY -->
        <div
            id="overlay"
            class="
                fixed
                inset-0
                bg-black/50
                z-40
                hidden
                md:hidden
            "
        ></div>

        <!-- SIDEBAR -->
        <aside
            id="sidebar"
            class="
                fixed
                md:static

                top-0
                left-0

                h-full
                w-72

                bg-zinc-900
                border-r
                border-zinc-800

                flex
                flex-col

                p-4

                z-50

                transform
                -translate-x-full
                md:translate-x-0

                transition-transform
                duration-300
            "
        >

            <!-- LOGO -->
            <div class="flex items-center justify-between mb-6">

                <h1 class="text-2xl font-bold">
                    AI Chat
                </h1>

                <!-- CLOSE BUTTON -->
                <button
                    id="closeBtn"
                    class="md:hidden text-2xl"
                >
                    ✕
                </button>

            </div>

            <!-- NEW CHAT -->
            <button class="
                bg-white
                text-black
                py-3
                rounded-xl
                font-semibold
                hover:bg-zinc-300
                transition
            ">
                + New Chat
            </button>

            <!-- CHAT HISTORY -->
            <div class="mt-8 space-y-3">

                <div class="
                    bg-zinc-800
                    p-3
                    rounded-lg
                    cursor-pointer
                    hover:bg-zinc-700
                    transition
                ">
                    Tailwind CSS Help
                </div>

                <div class="
                    bg-zinc-800
                    p-3
                    rounded-lg
                    cursor-pointer
                    hover:bg-zinc-700
                    transition
                ">
                    JavaScript Questions
                </div>

            </div>

        </aside>

        <!-- MAIN -->
        <main class="
            flex-1
            flex
            flex-col
            justify-between
            md:ml-0
        ">

            <!-- TOP BAR -->
            <div class="
                p-4
                border-b
                border-zinc-800
                flex
                items-center
                gap-4
            ">

                <!-- MENU BUTTON -->
                <button
                    id="menuBtn"
                    class="
                        text-2xl
                        md:hidden
                    "
                >
                    ☰
                </button>

                <h2 class="text-xl font-semibold">
                    AI Assistant
                </h2>

            </div>

            <!-- CHAT AREA -->
            <div
                id="chatArea"
                class="
                    flex-1
                    overflow-y-auto
                    p-6
                    space-y-6
                "
            >

                <!-- AI MESSAGE -->
                <div class="flex">

                    <div class="
                        bg-zinc-800
                        p-4
                        rounded-2xl
                        max-w-2xl
                    ">
                        Hello 😄 How can I help you today?
                    </div>

                </div>

                <!-- USER MESSAGE -->
                <div class="flex justify-end">

                    <div class="
                        bg-blue-600
                        p-4
                        rounded-2xl
                        max-w-2xl
                    ">
                        Teach me Tailwind CSS.
                    </div>

                </div>

            </div>

            <!-- INPUT -->
            <div class="
                p-4
                border-t
                border-zinc-800
            ">

                <div class="
                    flex
                    bg-zinc-900
                    rounded-2xl
                    overflow-hidden
                ">

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Type your message..."
                        class="
                            flex-1
                            bg-transparent
                            px-6
                            py-4
                            outline-none
                        "
                    >

                    <button 
                        id="sendBtn"
                        class="
                            bg-blue-600
                            px-8
                            hover:bg-blue-700
                            transition
                        "
                    >
                        Send
                    </button>

                </div>

            </div>

        </main>

    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
